# dsh-omni-canvas bundle layer: inserts the plugin row.
# Loaded by `dsh plugin --profile <name> add @local/dsh-omni-canvas`.
- insert:
    - id: dsh-omni-canvas
      name: '@local/dsh-omni-canvas'
      config:
        comfyUrl: 'http://127.0.0.1:8188'
        projectsDir: ''
        requestTimeoutMs: 30000
        pollIntervalMs: 2000
